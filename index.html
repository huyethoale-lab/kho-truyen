<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Kho Truyện - đọc truyện chữ, cập nhật chương mới, lưu tủ truyện"><title>Kho Truyện | Đọc truyện online</title><style>
:root{--bg:#f5f5f5;--panel:#fff;--text:#303030;--sub:#777;--line:#e6e6e6;--red:#b32932;--read:#f5efdf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 Arial,Helvetica,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}.container{max-width:1150px;margin:auto;padding:0 16px}.top{background:#fff;border-bottom:1px solid var(--line)}.top-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:70px}.logo{font:bold 29px Georgia,serif;color:var(--red);cursor:pointer}.tagline{color:var(--sub);font-size:12px}.nav{background:#b32932;color:#fff}.nav-inner{display:flex;flex-wrap:wrap;gap:0}.nav button{color:inherit;background:none;border:0;padding:12px 18px}.nav button:hover{background:#922029}.searchline{display:flex;gap:10px;align-items:center;margin:20px 0}.searchline input,.searchline select{border:1px solid #ddd;background:#fff;border-radius:3px;padding:10px;min-width:0}.searchline input{flex:1}.columns{display:grid;grid-template-columns:minmax(0,1fr) 275px;gap:20px}.section,.side{background:var(--panel);border:1px solid var(--line);margin-bottom:18px}.section h2,.side h2{margin:0;border-bottom:1px solid var(--line);padding:11px 15px;font-size:17px;color:var(--red)}.books{padding:0 15px}.book{display:grid;grid-template-columns:75px minmax(0,1fr) auto;gap:14px;padding:15px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}.book:last-child{border:0}.cover{height:105px;width:75px;background:linear-gradient(145deg,#49232c,#a44a50);color:white;display:flex;align-items:center;justify-content:center;text-align:center;padding:7px;font:bold 13px/1.35 Georgia,serif;overflow:hidden}.cover.c1{background:linear-gradient(145deg,#26404b,#638985)}.cover.c2{background:linear-gradient(145deg,#493955,#8b7299)}.cover img{width:100%;height:100%;object-fit:cover}.book h3{font-size:16px;margin:0 0 5px}.book:hover h3,.chapter-item:hover{color:var(--red)}.muted{color:var(--sub);font-size:12px}.summary{margin:7px 0 0;color:#666;font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.chapter-count{font-size:12px;color:var(--red);white-space:nowrap}.side-list{padding:4px 14px}.side-row{padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}.side-row:last-child{border:0}.side-row span{color:var(--red);font-weight:bold;margin-right:8px}.side-row small{display:block;color:var(--sub);padding-left:22px}.empty{padding:30px;color:var(--sub)}.detail{padding:20px;display:grid;grid-template-columns:160px 1fr;gap:22px}.detail .cover{width:160px;height:225px;font-size:22px}.detail h1{margin:0 0 8px;font-size:24px}.desc{white-space:pre-wrap}.btn{border:1px solid var(--red);padding:9px 14px;background:var(--red);color:#fff;border-radius:3px;margin:8px 8px 8px 0}.btn.alt{background:transparent;color:var(--red)}.chapter-grid{display:grid;grid-template-columns:1fr 1fr;padding:12px 18px;gap:0 20px}.chapter-item{padding:11px 0;border-bottom:1px dashed var(--line);background:none;border-left:0;border-top:0;border-right:0;text-align:left;cursor:pointer}.reader-shell{background:var(--read);padding:24px 28px;margin:20px 0 40px;border:1px solid #e4d9c4}.reader-shell h1{text-align:center;font-size:24px;margin:12px 0}.reader-shell .muted{text-align:center}.reader-content{font:var(--size,20px)/1.9 Arial,Helvetica,sans-serif;max-width:790px;margin:16px auto 26px;white-space:normal}.reader-content p{margin:0 0 1.25em}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:18px 0}.controls button{padding:9px 14px;border:1px solid #d4c6af;background:#fff;border-radius:3px}.dark{--bg:#171717;--panel:#242424;--text:#eee;--sub:#aaa;--line:#444;--read:#292723}.dark .top,.dark .searchline input,.dark .searchline select{background:var(--panel);color:var(--text)}.dark .summary{color:#bbb}.dark .reader-shell{border-color:#444}.dark .controls button{background:#383838;color:#eee;border-color:#555}footer{text-align:center;color:var(--sub);padding:30px}.hint{font-size:12px;color:var(--sub);margin:-8px 0 15px}@media(max-width:760px){.columns{grid-template-columns:1fr}.top-inner{min-height:60px}.logo{font-size:24px}.tagline{display:none}.nav button{padding:10px 12px}.book{grid-template-columns:65px minmax(0,1fr)}.book .cover{width:65px;height:91px}.chapter-count{grid-column:2}.summary{display:none}.detail{grid-template-columns:100px 1fr;padding:15px;gap:15px}.detail .cover{width:100px;height:145px;font-size:15px}.detail h1{font-size:20px}.chapter-grid{grid-template-columns:1fr}.reader-shell{padding:15px}.reader-content{line-height:1.85}}
</style></head><body><header class="top"><div class="container top-inner"><div class="logo" id="logo">✦ Kho Truyện</div><div class="tagline">Đọc truyện chữ • Cập nhật chương mới</div></div></header><nav class="nav"><div class="container nav-inner"><button data-nav="home">Trang chủ</button><button data-nav="all">Danh sách truyện</button><button data-nav="complete">Truyện hoàn thành</button><button data-nav="saved">Tủ truyện ♡</button></div></nav><main class="container" id="app"></main><footer>© <span id="year"></span> Kho Truyện · Kho truyện chữ</footer><script src="config.js"></script><script src="stories.js"></script><script>
const app=document.getElementById('app');let books=window.STORIES||[];let view='home',size=Number(localStorage.getItem('readerSize')||20);const cleanText=s=>String(s??'').normalize('NFC');const chapterLabel=(n,title)=>{const t=cleanText(title).trim().replace(/^chương\s*\d+\s*[:.\-–]?\s*/iu,'').trim();return 'Chương '+n+(t?': '+t:'')};const esc=s=>cleanText(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const saved=()=>JSON.parse(localStorage.getItem('savedBooks')||'[]');const progress=()=>JSON.parse(localStorage.getItem('progress')||'{}');const cover=(b,i)=>`<div class="cover c${i%3}">${b.cover?`<img src="${esc(b.cover)}" alt="Bìa ${esc(b.title)}">`:esc(b.title)}</div>`;function go(hash){if(location.hash===hash){render();window.scrollTo(0,0)}else location.hash=hash}function setView(v){view=v;go('#/')}function item(b,i){return `<div class="book" data-book="${esc(b.id)}">${cover(b,i)}<div><h3>${esc(b.title)}</h3><div class="muted">${esc(b.author)} · ${esc(b.genre)} · ${esc(b.status||'Đang ra')}</div><p class="summary">${esc(b.description)}</p></div><div class="chapter-count">${b.chapters.length} chương</div></div>`}function home(){const genres=[...new Set(books.map(b=>b.genre))];app.innerHTML=`<div class="searchline"><input id="search" placeholder="Tìm tên truyện, tác giả..." aria-label="Tìm truyện"><select id="genre" aria-label="Lọc thể loại"><option value="">Tất cả thể loại</option>${genres.map(g=>`<option>${esc(g)}</option>`).join('')}</select></div><div class="columns"><div><section class="section"><h2 id="heading">${view==='saved'?'Tủ truyện của bạn':view==='complete'?'Truyện hoàn thành':view==='all'?'Danh sách truyện':'Truyện đề cử & mới cập nhật'}</h2><div class="books" id="books"></div></section></div><aside><section class="side"><h2>Truyện mới cập nhật</h2><div class="side-list">${books.slice().reverse().map(b=>`<div class="side-row" data-book="${esc(b.id)}">${esc(b.title)}<small>${esc(chapterLabel(b.chapters.at(-1)?.chapter_number??b.chapters.length,b.chapters.at(-1)?.title||''))}</small></div>`).join('')}</div></section><section class="side"><h2>Thể loại</h2><div class="side-list">${genres.map(g=>`<div class="side-row" data-genre="${esc(g)}">${esc(g)}</div>`).join('')}</div></section><section class="side"><h2>Truyện nổi bật</h2><div class="side-list">${books.map((b,i)=>`<div class="side-row" data-book="${esc(b.id)}"><span>${i+1}</span>${esc(b.title)}</div>`).join('')}</div></section></aside></div><p class="hint">Danh sách nổi bật hiện là dữ liệu minh họa, chưa phải bảng xếp hạng lượt đọc thực tế.</p>`;function update(){let q=document.getElementById('search').value.toLocaleLowerCase('vi'),g=document.getElementById('genre').value;let list=books.filter(b=>(view!=='saved'||saved().includes(b.id))&&(view!=='complete'||b.status==='Hoàn thành')&&(!g||b.genre===g)&&(`${b.title} ${b.author}`.toLocaleLowerCase('vi').includes(q)));document.getElementById('books').innerHTML=list.length?list.map(item).join(''):'<div class="empty">Chưa có truyện phù hợp.</div>';wireBooks()}document.getElementById('search').oninput=update;document.getElementById('genre').onchange=update;document.querySelectorAll('[data-genre]').forEach(x=>x.onclick=()=>{document.getElementById('genre').value=x.dataset.genre;update()});update()}function wireBooks(){document.querySelectorAll('[data-book]').forEach(el=>el.onclick=()=>go('#/truyen/'+encodeURIComponent(el.dataset.book)))}function detail(b){const isSaved=saved().includes(b.id),p=progress()[b.id]||0;app.innerHTML=`<section class="section" style="margin-top:20px"><div class="detail">${cover(b,books.indexOf(b))}<div><h1>${esc(b.title)}</h1><p class="muted">Tác giả: ${esc(b.author)} · Thể loại: ${esc(b.genre)} · Trạng thái: ${esc(b.status||'Đang ra')} · ${b.chapters.length} chương</p><p class="desc">${esc(b.description)}</p><button class="btn" id="read">${p?'Đọc tiếp chương '+(p+1):'Đọc từ đầu'}</button><button class="btn alt" id="save">${isSaved?'♥ Đã lưu':'♡ Lưu truyện'}</button></div></div></section><section class="section"><h2>Danh sách chương</h2><div class="chapter-grid">${b.chapters.map((c,i)=>`<button class="chapter-item" data-ch="${i}">${esc(chapterLabel(c.chapter_number??i+1,c.title))}</button>`).join('')}</div></section>`;document.getElementById('read').onclick=()=>go(`#/doc/${b.id}/${Math.min(p,b.chapters.length-1)}`);document.getElementById('save').onclick=()=>{let s=saved();s=s.includes(b.id)?s.filter(x=>x!==b.id):[...s,b.id];localStorage.setItem('savedBooks',JSON.stringify(s));detail(b)};document.querySelectorAll('[data-ch]').forEach(x=>x.onclick=()=>go(`#/doc/${b.id}/${x.dataset.ch}`))}function reader(b,i){if(!b.chapters[i]){go('#/truyen/'+b.id);return}let p=progress();p[b.id]=i;localStorage.setItem('progress',JSON.stringify(p));const c=b.chapters[i];app.innerHTML=`<div class="reader-shell"><div class="controls"><button id="back">← Mục lục</button><button id="minus">A−</button><button id="plus">A+</button><button id="theme">Sáng / Tối</button></div><h1>${esc(chapterLabel(c.chapter_number??i+1,c.title))}</h1><div class="muted">${esc(b.title)} · ${esc(b.author)}</div><article class="reader-content" id="content" style="--size:${size}px">${cleanText(c.content).split(/\n\s*\n/).map(t=>`<p>${esc(t).replace(/\n/g,'<br>')}</p>`).join('')}</article><div class="controls"><button id="prev" ${i===0?'disabled':''}>← Chương trước</button><button id="next" ${i===b.chapters.length-1?'disabled':''}>Chương sau →</button></div></div>`;document.getElementById('back').onclick=()=>go('#/truyen/'+b.id);document.getElementById('prev').onclick=()=>go(`#/doc/${b.id}/${i-1}`);document.getElementById('next').onclick=()=>go(`#/doc/${b.id}/${i+1}`);document.getElementById('minus').onclick=()=>resize(-2);document.getElementById('plus').onclick=()=>resize(2);document.getElementById('theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('dark',document.body.classList.contains('dark'))}}function resize(n){size=Math.max(16,Math.min(30,size+n));localStorage.setItem('readerSize',size);document.getElementById('content').style.setProperty('--size',size+'px')}function render(){const parts=decodeURIComponent(location.hash.slice(2)).split('/'),b=books.find(x=>x.id===parts[1]);if(parts[0]==='truyen'&&b)detail(b);else if(parts[0]==='doc'&&b&&/^\d+$/.test(parts[2]||'')&&Number(parts[2])<b.chapters.length)reader(b,Number(parts[2]));else home()}document.getElementById('logo').onclick=()=>setView('home');document.querySelectorAll('[data-nav]').forEach(x=>x.onclick=()=>setView(x.dataset.nav));document.getElementById('year').textContent=new Date().getFullYear();if(localStorage.getItem('dark')==='true')document.body.classList.add('dark');window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
async function loadOnline(){if(!window.DB_CONFIG?.url||!window.DB_CONFIG?.anonKey)return;try{const h={apikey:DB_CONFIG.anonKey,Authorization:'Bearer '+DB_CONFIG.anonKey};const r=await fetch(DB_CONFIG.url+'/rest/v1/stories?select=*&order=created_at.desc',{headers:h});if(!r.ok)throw Error('Không tải được danh sách truyện');const data=(await r.json()).filter(b=>b.is_published===true);const mapped=await Promise.all(data.map(async b=>{const cr=await fetch(DB_CONFIG.url+'/rest/v1/chapters?select=*&story_id=eq.'+encodeURIComponent(b.id)+'&order=chapter_number.asc',{headers:h});if(!cr.ok)throw Error('Không tải được chương');const chapters=(await cr.json()).filter(c=>c.is_published===true).map(c=>({title:c.title,content:c.content,chapter_number:c.chapter_number}));return {id:b.id,title:b.title,author:b.author,genre:b.genre,status:b.status==='completed'?'Hoàn thành':'Đang ra',description:b.description,cover:b.cover_url,chapters}}));books=mapped;render()}catch(e){books=[];app.innerHTML='<div class="empty">Không kết nối được kho truyện trực tuyến. Hãy kiểm tra cấu hình và kết nối mạng.</div>';console.error(e)}}loadOnline();
</script></body></html>
